spring.application.name=careround-care-task-service
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/careround_care_task_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.public-key=${JWT_PUBLIC_KEY}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=care-task-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# gRPC clients: patient-service (patient existence + ward on task creation), ward-service (charge-nurse check for stats)
grpc.client.patient-service.address=static://localhost:9090
grpc.client.patient-service.negotiationType=plaintext
app.grpc.deadline-ms=5000
grpc.client.ward-service.address=static://localhost:9093
grpc.client.ward-service.negotiationType=plaintext

# gRPC server — serves GetPendingTaskIds to round-service (tasksAcknowledged gate)
grpc.server.port=9094

logging.level.org.springframework.web=DEBUG
logging.level.com.dayo.careround=DEBUG
logging.level.io.grpc=DEBUG
# OVERDUE delay queue (PRD 8.3): Redis ZSET of open-task deadlines, rebuilt from Postgres by reconciliation.
# Redis has no persistence here, so it is only a timer index; Postgres is the truth.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
app.overdue.queue-key=careround:task-deadlines
app.overdue.poll-ms=2000
app.overdue.batch-size=100
app.overdue.retry-backoff-ms=30000
app.overdue.reconcile-ms=300000
# Open tasks past their deadline by more than this become OVERDUE without events (old data on first run).
app.overdue.backfill-max-age-hours=24
