syntax = "proto3";

package careround.caretask;

option java_package = "com.dayo.careround.caretaskservice.grpc";
option java_multiple_files = true;

service CareTaskQueryService {
  rpc GetPendingTaskIds (PendingTaskIdsRequest) returns (PendingTaskIdsResponse);
}

message PendingTaskIdsRequest {
  string patient_id = 1;
}

message PendingTaskIdsResponse {
  repeated string task_ids = 1;
}